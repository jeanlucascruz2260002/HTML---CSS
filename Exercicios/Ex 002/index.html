<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos e quebras de linha</title>
</head>
<body>
    <h1>Paragrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever
        um paragrafo de qualquer jeito
       <br> contanto que esteja entre a Tag &lt;p &gt;e &lt;/p&gt;
       <br>Para haver alguma quebra basta colocar a tag br
    </p>
    <p>Vamos adicionar símbolos especiais:
        &reg;
        &copy;
        &trade;
        ✔️
        ❤️
    </p>
</body>
</html>

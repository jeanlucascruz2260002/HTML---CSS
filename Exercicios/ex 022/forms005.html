<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.py" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexmas"><label for="isexmas">Masculino</label><br>
            <input type="radio" name="sexo" id="isexfem"><label for="isexfem">Feminino</label><br>
            <input type="radio" name="sexo" id="inf"><label for="inf">Não faço</label><br>
        </fieldset>
        <fieldset>
                <legend>Espostes favoritos</legend>
                <input type="checkbox" name="efut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
                <input type="checkbox" name="ebas" id="iebas"> <label for="iebas">Basquete</label> <br>
                <input type="checkbox" name="eten" id="ieten"> <label for="ieten">Tênis</label> <br>
                <input type="checkbox" name="enat" id="ienat"> <label for="ienat">Natação</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>

        * { /* Configurações Globais do CSS*/
            height: 100%;

        body {

            height: 100%;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h2>Testando Gradiente</h2>
</body>
</html>

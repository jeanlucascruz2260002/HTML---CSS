<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibe box</title>
    <style>
        div.container {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">a</div>
        <div class="item">b</div>
        <div class="item">c</div>
        <div class="item">d Lorem ipsum dolor sit amet consectetur adipisicing elit. </div>
        <div class="item">e</div>
        <div class="item">f Et ex corrupti voluptatem ad fugit necessitatibus aut. Magnam similique, at voluptatem quas soluta nostrum expedita ab harum odio veniam molestiae. Non!</div>
        <div class="item">g</div>
    </div>
</body>
</html>
